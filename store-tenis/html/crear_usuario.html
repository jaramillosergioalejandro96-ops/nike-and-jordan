<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Usuario · Nike × Jordan Store</title>
<link rel="stylesheet" href="../css/crear.css">
</head>
<body>

<div class="login-page">

  <div class="login-brand">
    <div class="login-brand-bg"></div>
    <div class="login-brand-gradient"></div>

    <div class="login-brand-content">
      <div class="logo">
        <span class="logo-text">NIKE</span>
        <span class="logo-x">×</span>
        <span class="logo-text">JORDAN</span>
      </div>

      <h1 class="login-brand-title">
        NUEVO
        <br>
        <span class="login-brand-accent">USUARIO</span>
      </h1>
      <p class="login-brand-text">Da de alta un nuevo usuario de la tienda.</p>
    </div>
  </div>

  <div class="login-form-panel">
    <div class="login-form-wrap">

      <h2 class="login-title">Crear Usuario</h2>
      <p class="login-subtitle">Completa los datos para registrar un nuevo usuario</p>

      <form id="registerForm" novalidate>

        <div class="form-group">
          <label class="form-label" for="fullName">Nombre completo</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
            </svg>
            <input type="text" id="fullName" class="form-input" placeholder="Ej. María Torres" autocomplete="name">
          </div>
          <span class="form-error" id="fullNameError"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 6l-10 7L2 6"/>
              <path d="M2 6h20v12H2z"/>
            </svg>
            <input type="text" id="email" class="form-input" placeholder="tucorreo@ejemplo.com" autocomplete="email">
          </div>
          <span class="form-error" id="emailError"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="username">Nombre de usuario</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M22 21v-2a4 4 0 00-3-3.87"/>
              <path d="M16 3.13a4 4 0 010 7.75"/>
            </svg>
            <input type="text" id="username" class="form-input" placeholder="mtorres" autocomplete="off">
          </div>
          <span class="form-error" id="usernameError"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="11" width="14" height="10" rx="2"/>
              <path d="M8 11V7a4 4 0 018 0v4"/>
            </svg>
            <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar contraseña">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="form-error" id="passwordError"></span>

          <div class="password-strength" id="strengthWrap" style="display:none;">
            <div class="strength-bar">
              <div class="strength-fill" id="strengthFill"></div>
            </div>
            <span class="strength-label" id="strengthLabel"></span>
          </div>

          <ul class="rules-list" id="rulesList">
            <li data-rule="length">Mínimo 8 caracteres</li>
            <li data-rule="upper">Una letra mayúscula</li>
            <li data-rule="lower">Una letra minúscula</li>
            <li data-rule="number">Un número</li>
            <li data-rule="special">Un carácter especial</li>
          </ul>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirmar contraseña</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="11" width="14" height="10" rx="2"/>
              <path d="M8 11V7a4 4 0 018 0v4"/>
            </svg>
            <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" autocomplete="new-password">
            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Mostrar contraseña">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="form-error" id="confirmPasswordError"></span>
        </div>

     
      
        <span class="form-error" id="termsError"></span>

        <div class="form-banner" id="formBanner" style="display:none;"></div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span id="submitText">Crear Usuario</span>
        </button>
      </form>

      <div class="login-footer-note">
        ¿Ya tienes cuenta? <a href="inicio_sesion.html">Ir a iniciar sesión</a>
      </div>
    </div>
  </div>

</div>

<script src="../js/crear.js"></script>
</body>
</html>
