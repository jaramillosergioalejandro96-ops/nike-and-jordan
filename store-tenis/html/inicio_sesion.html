<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Nike × Jordan Store</title>
<link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="login-page">


  <div class="login-brand">
    <div class="login-brand-bg"></div>
    <div class="login-brand-gradient"></div>

    <div class="login-brand-content">
      <div class="logo">
        <span class="logo-text">NIKE</span>
        <span class="logo-x">×</span>
        <span class="logo-text">JORDAN</span>
      </div>

      <h1 class="login-brand-title">
        BIENVENIDO
        <br>
        <span class="login-brand-accent">DE VUELTA</span>
      </h1>
      <p class="login-brand-text">Inicia sesión para seguir con tu compra.</p>
    </div>
  </div>

  <div class="login-form-panel">
    <div class="login-form-wrap">

      <h2 class="login-title">Iniciar Sesión</h2>
      <p class="login-subtitle">Ingresa tus credenciales para iniciar sesión</p>

      <form id="loginForm" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16v16H4z" opacity="0"/>
              <path d="M22 6l-10 7L2 6"/>
              <path d="M2 6h20v12H2z"/>
            </svg>
            <input type="text" id="email" class="form-input" placeholder="tucorreo@ejemplo.com" autocomplete="username">
          </div>
          <span class="form-error" id="emailError"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="11" width="14" height="10" rx="2"/>
              <path d="M8 11V7a4 4 0 018 0v4"/>
            </svg>
            <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="form-error" id="passwordError"></span>

          <div class="password-strength" id="strengthWrap" style="display:none;">
            <div class="strength-bar">
              <div class="strength-fill" id="strengthFill"></div>
            </div>
            <span class="strength-label" id="strengthLabel"></span>
          </div>
        </div>

        <div class="form-row">
          <label class="checkbox-wrap">
            <input type="checkbox" id="remember">
            <span class="checkbox-box"></span>
            Recordarme
          </label>
        </div>

        <div class="form-banner" id="formBanner" style="display:none;"></div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span id="submitText">Iniciar Sesión</span>
        </button>

        <div class="attempts-note" id="attemptsNote"></div>
      </form>

      <div class="login-footer-note">
        ¿Quieres volver a la tienda? <a href="../index.html">Volver a la tienda</a>
      </div>
    </div>
  </div>

</div>

<script src="../js/login.js"></script>
</body>
</html>
